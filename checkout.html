<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - PetToy Store</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; }
        .checkout-panel { background: var(--bg-light); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 1.5rem; }
        .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; }
    </style>
</head>
<body>
    <header></header>

    <main class="main-content">
        <div class="page-section">
            <h1 style="margin-bottom: 0.25rem;">Delivery &amp; Payment Checkout</h1>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Confirm your shipping address and payment details to place your order.</p>

            <form onsubmit="window.handleCheckout(event)">
                <div class="checkout-grid">
                    <div class="checkout-panel">
                        <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">1. Shipping Details</h2>
                        <div class="form-group">
                            <label for="checkout-name">Recipient Full Name</label>
                            <input type="text" id="checkout-name" placeholder="Alice Tan" required>
                        </div>
                        <div class="form-group">
                            <label for="checkout-phone">Contact Phone (+60)</label>
                            <input type="tel" id="checkout-phone" maxlength="12" placeholder="12 3456 7890" required>
                        </div>
                        <div class="form-group">
                            <label for="checkout-address">Street Address</label>
                            <input type="text" id="checkout-address" placeholder="No. 12, Jalan Melaka Raya" required>
                        </div>
                        <div class="form-row-2">
                            <div class="form-group">
                                <label for="checkout-city">City</label>
                                <input type="text" id="checkout-city" placeholder="Melaka" required>
                            </div>
                            <div class="form-group">
                                <label for="checkout-postcode">Postcode</label>
                                <input type="text" id="checkout-postcode" maxlength="5" placeholder="75000" required>
                            </div>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="checkout-state">State</label>
                            <select id="checkout-state" required>
                                <option value="Melaka">Melaka</option>
                                <option value="Selangor">Selangor</option>
                                <option value="Kuala Lumpur">Kuala Lumpur</option>
                                <option value="Putrajaya">Putrajaya</option>
                                <option value="Labuan">Labuan</option>
                                <option value="Johor">Johor</option>
                                <option value="Penang">Penang</option>
                                <option value="Perak">Perak</option>
                                <option value="Perlis">Perlis</option>
                                <option value="Negeri Sembilan">Negeri Sembilan</option>
                                <option value="Pahang">Pahang</option>
                                <option value="Kedah">Kedah</option>
                                <option value="Kelantan">Kelantan</option>
                                <option value="Terengganu">Terengganu</option>
                                <option value="Sabah">Sabah</option>
                                <option value="Sarawak">Sarawak</option>
                            </select>
                        </div>
                    </div>

                    <div class="checkout-panel">
                        <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">2. Payment &amp; Order Summary</h2>
                        <div class="form-group">
                            <label for="checkout-card">Card Number</label>
                            <input type="text" id="checkout-card" maxlength="19" placeholder="1234 5678 9012 3456" oninput="window.formatCardNumber(this)" required>
                        </div>
                        <div class="form-row-3">
                            <div class="form-group">
                                <label for="checkout-exp-month">Exp Month</label>
                                <select id="checkout-exp-month" required>
                                    <option value="01">01</option><option value="02">02</option><option value="03">03</option>
                                    <option value="04">04</option><option value="05">05</option><option value="06">06</option>
                                    <option value="07">07</option><option value="08">08</option><option value="09">09</option>
                                    <option value="10">10</option><option value="11">11</option><option value="12">12</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="checkout-exp-year">Exp Year</label>
                                <select id="checkout-exp-year" required>
                                    <option value="2026">2026</option><option value="2027">2027</option>
                                    <option value="2028" selected>2028</option><option value="2029">2029</option>
                                    <option value="2030">2030</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="checkout-cvv">CVV</label>
                                <input type="password" id="checkout-cvv" maxlength="3" placeholder="123" required>
                            </div>
                        </div>

                        <div class="cart-summary-box" style="max-width: 100%; margin: 0 0 1.25rem;">
                            <div class="cart-summary-row"><span>Subtotal</span><strong id="checkout-subtotal-display">RM0.00</strong></div>
                            <div class="cart-summary-row"><span>Shipping</span><span id="checkout-shipping-display">RM0.00</span></div>
                            <div class="cart-summary-row"><span>SST (6%)</span><span id="checkout-tax-display">RM0.00</span></div>
                            <div class="cart-summary-row total"><span>Total</span><span id="checkout-total-display">RM0.00</span></div>
                        </div>

                        <button type="submit" class="btn" style="width: 100%;">Confirm &amp; Pay Order 🚚</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>
    <footer></footer>

    <script src="../app.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await window.initCustomerPage();
            await window.initCheckoutPage();
            const cvvInput = document.getElementById('checkout-cvv');
            if (cvvInput) {
                cvvInput.addEventListener('input', () => {
                    cvvInput.value = cvvInput.value.replace(/\D/g, '').slice(0, 3);
                });
            }
        });
    </script>
</body>
</html>
