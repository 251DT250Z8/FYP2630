<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - PetToy Store</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-box { max-width: 680px; margin: 0 auto; }
        .profile-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
        .profile-card { background: var(--bg-light); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; }
        .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .phone-row { display: flex; gap: 0.75rem; }
        .phone-ext-col { width: 140px; }
        .phone-num-col { flex: 1; }
        .readonly-field { background-color: #f1f5f9 !important; color: var(--text-muted); }
        .pw-wrapper { position: relative; }
        .pw-input { padding-right: 4rem !important; }
        .pw-toggle { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 0.85rem; color: var(--primary); font-weight: 700; }
        .edit-actions { display: none; gap: 1rem; margin-top: 1.5rem; }
        #profile-password-section { display: none; }
    </style>
</head>
<body>
    <header></header>

    <main class="main-content">
        <div class="page-section profile-box">
            <div class="profile-header">
                <div>
                    <h1 style="margin-bottom: 0.25rem;">Profile</h1>
                    <p style="margin-bottom: 0; color: var(--text-muted);">View your saved contact details or click Edit to update.</p>
                </div>
                <button type="button" id="profile-edit-btn" class="btn btn-outline" onclick="window.toggleProfileEditMode(true)">✏️ Edit Profile</button>
            </div>

            <form onsubmit="window.handleUpdateProfile(event)">
                <div class="profile-card">
                    <h2 style="font-size: 1.15rem; margin-bottom: 1rem;">Personal &amp; Address Details</h2>

                    <div class="name-row">
                        <div class="form-group">
                            <label for="prof-fname">First Name</label>
                            <input type="text" id="prof-fname" disabled required>
                        </div>
                        <div class="form-group">
                            <label for="prof-lname">Last Name <small style="color:var(--text-muted); font-weight:400;">(Optional)</small></label>
                            <input type="text" id="prof-lname" disabled>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="prof-email">Email Address (Login ID)</label>
                        <input type="email" id="prof-email" class="readonly-field" disabled readonly>
                    </div>

                    <div class="form-group">
                        <label for="prof-phone">Contact Phone</label>
                        <div class="phone-row">
                            <div class="phone-ext-col">
                                <select id="prof-phone-ext" class="readonly-field" disabled>
                                    <option value="+60" selected>+60 (MY)</option>
                                </select>
                            </div>
                            <div class="phone-num-col">
                                <input type="tel" id="prof-phone" maxlength="12" placeholder="12 3456 7890" disabled>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="prof-addr1">Street Address</label>
                        <input type="text" id="prof-addr1" placeholder="No. 12, Jalan Melaka Raya" disabled>
                    </div>

                    <div class="name-row">
                        <div class="form-group">
                            <label for="prof-city">City</label>
                            <input type="text" id="prof-city" placeholder="Melaka" disabled>
                        </div>
                        <div class="form-group">
                            <label for="prof-state">State</label>
                            <select id="prof-state" disabled>
                                <option value="">-- Select State --</option>
                                <option value="Melaka">Melaka</option>
                                <option value="Selangor">Selangor</option>
                                <option value="Kuala Lumpur">Kuala Lumpur</option>
                                <option value="Putrajaya">Putrajaya</option>
                                <option value="Labuan">Labuan</option>
                                <option value="Johor">Johor</option>
                                <option value="Penang">Penang</option>
                                <option value="Perak">Perak</option>
                                <option value="Perlis">Perlis</option>
                                <option value="Negeri Sembilan">Negeri Sembilan</option>
                                <option value="Pahang">Pahang</option>
                                <option value="Kedah">Kedah</option>
                                <option value="Kelantan">Kelantan</option>
                                <option value="Terengganu">Terengganu</option>
                                <option value="Sabah">Sabah</option>
                                <option value="Sarawak">Sarawak</option>
                            </select>
                        </div>
                    </div>

                    <div class="name-row">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="prof-zip">Postcode</label>
                            <input type="text" id="prof-zip" maxlength="5" pattern="[0-9]{5}" title="5-digit Malaysian postcode (e.g. 75000)" placeholder="75000" disabled>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="prof-country">Country</label>
                            <select id="prof-country" class="readonly-field" disabled>
                                <option value="Malaysia" selected>Malaysia</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="profile-password-section" class="profile-card">
                    <h2 style="font-size: 1.15rem; margin-bottom: 0.35rem;">Security &amp; Password</h2>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">Leave blank unless you wish to change your password.</p>

                    <div class="form-group">
                        <label for="prof-current-pass">Current Password</label>
                        <div class="pw-wrapper">
                            <input type="password" id="prof-current-pass" class="pw-input" placeholder="Enter current password">
                            <span class="pw-toggle" onclick="window.togglePassword('prof-current-pass', this)">Show</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="prof-new-pass">New Password</label>
                        <div class="pw-wrapper">
                            <input type="password" id="prof-new-pass" class="pw-input" placeholder="Minimum 6 characters" oninput="window.checkPasswordMatch()">
                            <span class="pw-toggle" onclick="window.togglePassword('prof-new-pass', this)">Show</span>
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="prof-confirm-pass">Confirm New Password</label>
                        <div class="pw-wrapper">
                            <input type="password" id="prof-confirm-pass" class="pw-input" placeholder="Re-enter new password" oninput="window.checkPasswordMatch()">
                            <span class="pw-toggle" onclick="window.togglePassword('prof-confirm-pass', this)">Show</span>
                        </div>
                        <small id="password-match-msg" style="display: block; margin-top: 0.35rem; font-weight: 600;"></small>
                    </div>
                </div>

                <div id="profile-edit-actions" class="edit-actions">
                    <button type="submit" id="profile-save-btn" class="btn" style="flex: 1;">💾 Save Changes</button>
                    <button type="button" id="profile-cancel-btn" class="btn btn-outline" onclick="window.toggleProfileEditMode(false)" style="flex: 1;">Cancel</button>
                </div>
            </form>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>
    <footer></footer>

    <script src="../app.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await window.initCustomerPage();
            window.initProfilePage();
        });
    </script>
</body>
</html>
