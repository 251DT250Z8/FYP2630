<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 980" width="100%" height="100%" style="background:#ffffff; font-family:Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="50" y="45" font-size="20" font-weight="bold" fill="#000000">DFD Level: 0</text>

  <!-- ==================== PROCESS 1.0 : REGISTER ==================== -->
  <!-- Entity: Customer (Top) -->
  <rect x="50" y="115" width="100" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="100" y="148" font-size="14" text-anchor="middle" fill="#000000">Customer</text>

  <!-- Process 1.0: Register -->
  <path d="M 300,100 C 300,65 400,65 400,100 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="350" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">1.0</text>
  <rect x="300" y="100" width="100" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="350" y="128" font-size="13" text-anchor="middle" fill="#000000">Register</text>

  <!-- Data Store D1: User (Gane & Sarson open rectangle on right) -->
  <path d="M 750,160 L 600,160 L 600,215 L 750,215" fill="none" stroke="#000000" stroke-width="1.8"/>
  <line x1="638" y1="160" x2="638" y2="215" stroke="#000000" stroke-width="1.8"/>
  <text x="619" y="193" font-size="13" text-anchor="middle" fill="#000000">D1</text>
  <text x="690" y="193" font-size="13" text-anchor="middle" fill="#000000">User</text>

  <!-- Flows for 1.0 -->
  <!-- Customer details -> 1.0 -->
  <path d="M 150,130 L 300,130" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="225" y="122" font-size="11" text-anchor="middle" fill="#000000">Customer details</text>

  <!-- 1.0 -> Registration confirmation message -> Customer -->
  <path d="M 300,100 L 75,100 L 75,115" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="175" y="93" font-size="11" text-anchor="middle" fill="#000000">Registration confirmation message</text>

  <!-- 1.0 -> updated customer list -> D1 -->
  <path d="M 400,115 L 650,115 L 650,160" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="525" y="108" font-size="11" text-anchor="middle" fill="#000000">Updated customer list</text>


  <!-- ==================== PROCESS 2.0 : LOGIN ==================== -->
  <!-- Process 2.0: Login -->
  <path d="M 300,210 C 300,175 400,175 400,210 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="350" y="200" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">2.0</text>
  <rect x="300" y="210" width="100" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="350" y="238" font-size="13" text-anchor="middle" fill="#000000">Login</text>

  <!-- Flows for 2.0 -->
  <!-- Customer -> username and password -> 2.0 -->
  <path d="M 90,170 L 90,240 L 300,240" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="195" y="253" font-size="11" text-anchor="middle" fill="#000000">username and password</text>

  <!-- 2.0 -> login confirmation message -> Customer -->
  <path d="M 300,220 L 75,220 L 75,170" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="195" y="213" font-size="11" text-anchor="middle" fill="#000000">login confirmation message</text>

  <!-- D1 User -> username and password -> 2.0 -->
  <path d="M 600,210 L 400,210" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="500" y="203" font-size="11" text-anchor="middle" fill="#000000">username and password</text>


  <!-- ==================== PROCESS 3.0 : UPDATE & VIEW PRODUCT ==================== -->
  <!-- Entity: Staff (Left) -->
  <rect x="50" y="335" width="100" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="100" y="368" font-size="14" text-anchor="middle" fill="#000000">Staff</text>

  <!-- Process 3.0: update & view product catalogue -->
  <path d="M 300,325 C 300,290 400,290 400,325 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="350" y="315" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">3.0</text>
  <rect x="300" y="325" width="100" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="350" y="342" font-size="11" text-anchor="middle" fill="#000000">update &amp; view</text>
  <text x="350" y="356" font-size="11" text-anchor="middle" fill="#000000">product</text>
  <text x="350" y="370" font-size="11" text-anchor="middle" fill="#000000">catalogue</text>

  <!-- Data Store D2: Product -->
  <path d="M 750,335 L 600,335 L 600,390 L 750,390" fill="none" stroke="#000000" stroke-width="1.8"/>
  <line x1="638" y1="335" x2="638" y2="390" stroke="#000000" stroke-width="1.8"/>
  <text x="619" y="368" font-size="13" text-anchor="middle" fill="#000000">D2</text>
  <text x="690" y="368" font-size="13" text-anchor="middle" fill="#000000">Product</text>

  <!-- Flows for 3.0 -->
  <!-- Staff -> Product details -> 3.0 -->
  <path d="M 150,355 L 300,355" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="225" y="348" font-size="11" text-anchor="middle" fill="#000000">Product details</text>

  <!-- 3.0 -> updated product details -> D2 -->
  <path d="M 400,342 L 600,342" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="500" y="335" font-size="11" text-anchor="middle" fill="#000000">updated product details</text>

  <!-- D2 -> updated product details -> 3.0 -->
  <path d="M 600,375 L 400,375" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="500" y="390" font-size="11" text-anchor="middle" fill="#000000">updated product details</text>

  <!-- 3.0 -> Product catalogue -> Customer (Upwards to customer entity) -->
  <path d="M 300,335 L 115,335 L 115,170" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="200" y="328" font-size="11" text-anchor="middle" fill="#000000">Product catalogue</text>


  <!-- ==================== PROCESS 4.0 : PLACE ORDER ==================== -->
  <!-- Entity: Customer (Lower) -->
  <g>
    <!-- Folded corner styling as in reference -->
    <path d="M 50,475 L 135,475 L 150,490 L 150,530 L 50,530 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <path d="M 50,490 L 65,475" stroke="#000000" stroke-width="1.3"/>
    <text x="100" y="508" font-size="14" text-anchor="middle" fill="#000000">Customer</text>
  </g>

  <!-- Process 4.0: place order & generate coupon/receipt -->
  <path d="M 300,470 C 300,435 400,435 400,470 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="350" y="460" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">4.0</text>
  <rect x="300" y="470" width="100" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="350" y="487" font-size="11" text-anchor="middle" fill="#000000">place order &amp;</text>
  <text x="350" y="502" font-size="11" text-anchor="middle" fill="#000000">generate</text>
  <text x="350" y="516" font-size="11" text-anchor="middle" fill="#000000">invoice</text>

  <!-- Data Store D3: Order -->
  <path d="M 750,485 L 600,485 L 600,540 L 750,540" fill="none" stroke="#000000" stroke-width="1.8"/>
  <line x1="638" y1="485" x2="638" y2="540" stroke="#000000" stroke-width="1.8"/>
  <text x="619" y="518" font-size="13" text-anchor="middle" fill="#000000">D3</text>
  <text x="690" y="518" font-size="13" text-anchor="middle" fill="#000000">Order</text>

  <!-- Flows for 4.0 -->
  <!-- Customer -> order info -> 4.0 -->
  <path d="M 150,485 L 300,485" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="225" y="478" font-size="11" text-anchor="middle" fill="#000000">order info</text>

  <!-- 4.0 -> invoice receipt -> Customer -->
  <path d="M 300,510 L 150,510" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="225" y="525" font-size="11" text-anchor="middle" fill="#000000">invoice receipt</text>

  <!-- 4.0 -> updated order info -> D3 Order -->
  <path d="M 400,495 L 600,495" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="500" y="488" font-size="11" text-anchor="middle" fill="#000000">updated order info</text>


  <!-- ==================== PROCESS 5.0 : GENERATE SALES REPORT ==================== -->
  <!-- Entity: Administrator (Bottom Left) -->
  <rect x="50" y="625" width="100" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="100" y="658" font-size="13" text-anchor="middle" fill="#000000">Administrator</text>

  <!-- Process 5.0: Generate sales report -->
  <path d="M 300,615 C 300,580 400,580 400,615 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="350" y="605" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">5.0</text>
  <rect x="300" y="615" width="100" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="350" y="635" font-size="11" text-anchor="middle" fill="#000000">Generate sales</text>
  <text x="350" y="652" font-size="11" text-anchor="middle" fill="#000000">report</text>

  <!-- Flows for 5.0 -->
  <!-- D3 Order -> updated order details -> 5.0 -->
  <path d="M 660,540 L 660,640 L 400,640" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="530" y="633" font-size="11" text-anchor="middle" fill="#000000">updated order details</text>

  <!-- 5.0 -> sales report -> Administrator -->
  <path d="M 300,652 L 150,652" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="225" y="645" font-size="11" text-anchor="middle" fill="#000000">sales report</text>

</svg>
