<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" width="880" height="650" style="background:#ffffff; font-family:Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="40" font-size="18" font-weight="bold" fill="#000000">DFD Level: 0</text>

  <!-- ==================== PROCESS 1.0 : REGISTER ==================== -->
  <!-- Entity: Customer (Top Left) -->
  <rect x="40" y="125" width="115" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="97.5" y="157" font-size="13" text-anchor="middle" fill="#000000">Customer</text>

  <!-- Process 1.0: Register -->
  <path d="M 310,105 C 310,68 430,68 430,105 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="370" y="95" font-size="13" text-anchor="middle" fill="#000000">1.0</text>
  <rect x="310" y="105" width="120" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="370" y="131" font-size="13" text-anchor="middle" fill="#000000">Register</text>

  <!-- Data Store D1: User (Open on right) -->
  <path d="M 820,170 L 630,170 L 630,220 L 820,220" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="670" y1="170" x2="670" y2="220" stroke="#000000" stroke-width="1.5"/>
  <text x="650" y="200" font-size="13" text-anchor="middle" fill="#000000">D1</text>
  <text x="735" y="200" font-size="13" text-anchor="middle" fill="#000000">User</text>

  <!-- Flows for 1.0 -->
  <path d="M 310,108 L 85,108 L 85,125" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="198" y="101" font-size="11" text-anchor="middle" fill="#000000">Registration confirmation message</text>

  <path d="M 155,135 L 310,135" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="232" y="129" font-size="11" text-anchor="middle" fill="#000000">Customer details</text>

  <path d="M 430,125 L 690,125 L 690,170" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="560" y="118" font-size="11" text-anchor="middle" fill="#000000">Updated customer list</text>


  <!-- ==================== PROCESS 2.0 : LOGIN ==================== -->
  <!-- Process 2.0: Login -->
  <path d="M 310,205 C 310,168 430,168 430,205 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="370" y="195" font-size="13" text-anchor="middle" fill="#000000">2.0</text>
  <rect x="310" y="205" width="120" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="370" y="231" font-size="13" text-anchor="middle" fill="#000000">Login</text>

  <!-- Flows for 2.0 -->
  <path d="M 310,213 L 118,213 L 118,180" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="214" y="206" font-size="11" text-anchor="middle" fill="#000000">login confirmation message</text>

  <path d="M 95,180 L 95,235 L 310,235" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="202" y="249" font-size="11" text-anchor="middle" fill="#000000">username and password</text>

  <path d="M 630,210 L 430,210" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="530" y="203" font-size="11" text-anchor="middle" fill="#000000">username and password</text>


  <!-- ==================== PROCESS 3.0 : UPDATE & VIEW PRODUCT CATALOGUE ==================== -->
  <!-- Entity: Staff -->
  <rect x="40" y="325" width="115" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="97.5" y="357" font-size="13" text-anchor="middle" fill="#000000">Staff</text>

  <!-- Process 3.0 -->
  <path d="M 310,305 C 310,268 430,268 430,305 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="370" y="295" font-size="13" text-anchor="middle" fill="#000000">3.0</text>
  <rect x="310" y="305" width="120" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="370" y="328" font-size="12" text-anchor="middle" fill="#000000">update &amp; view</text>
  <text x="370" y="345" font-size="12" text-anchor="middle" fill="#000000">product catalogue</text>

  <!-- Data Store D2: Product -->
  <path d="M 820,305 L 630,305 L 630,355 L 820,355" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="670" y1="305" x2="670" y2="355" stroke="#000000" stroke-width="1.5"/>
  <text x="650" y="335" font-size="13" text-anchor="middle" fill="#000000">D2</text>
  <text x="735" y="335" font-size="13" text-anchor="middle" fill="#000000">Product</text>

  <!-- Flows for 3.0 -->
  <path d="M 310,310 L 138,310 L 138,180" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="224" y="303" font-size="11" text-anchor="middle" fill="#000000">Product catalogue</text>

  <path d="M 155,348 L 310,348" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="232" y="341" font-size="11" text-anchor="middle" fill="#000000">Product details</text>

  <path d="M 430,318 L 630,318" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="530" y="311" font-size="11" text-anchor="middle" fill="#000000">updated product details</text>

  <path d="M 630,345 L 430,345" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="530" y="360" font-size="11" text-anchor="middle" fill="#000000">updated product details</text>


  <!-- ==================== PROCESS 4.0 : PLACE ORDER & GENERATE INVOICE ==================== -->
  <!-- Entity: Customer (Duplicate with diagonal corner slash) -->
  <g>
    <rect x="40" y="445" width="115" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <line x1="40" y1="460" x2="55" y2="445" stroke="#000000" stroke-width="1.3"/>
    <text x="97.5" y="475" font-size="13" text-anchor="middle" fill="#000000">Customer</text>
  </g>

  <!-- Process 4.0 -->
  <path d="M 310,435 C 310,398 430,398 430,435 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="370" y="425" font-size="13" text-anchor="middle" fill="#000000">4.0</text>
  <rect x="310" y="435" width="120" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="370" y="458" font-size="12" text-anchor="middle" fill="#000000">place order &amp;</text>
  <text x="370" y="475" font-size="12" text-anchor="middle" fill="#000000">generate invoice</text>

  <!-- Data Store D3: Order -->
  <path d="M 820,435 L 630,435 L 630,485 L 820,485" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="670" y1="435" x2="670" y2="485" stroke="#000000" stroke-width="1.5"/>
  <text x="650" y="465" font-size="13" text-anchor="middle" fill="#000000">D3</text>
  <text x="735" y="465" font-size="13" text-anchor="middle" fill="#000000">Order</text>

  <!-- Flows for 4.0 -->
  <path d="M 155,458 L 310,458" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="232" y="451" font-size="11" text-anchor="middle" fill="#000000">order info</text>

  <path d="M 310,480 L 155,480" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="232" y="495" font-size="11" text-anchor="middle" fill="#000000">invoice</text>

  <path d="M 430,460 L 630,460" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="530" y="453" font-size="11" text-anchor="middle" fill="#000000">updated order info</text>


  <!-- ==================== PROCESS 5.0 : GENERATE SALES REPORT ==================== -->
  <!-- Entity: Administrator -->
  <rect x="40" y="565" width="115" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="97.5" y="595" font-size="13" text-anchor="middle" fill="#000000">Administrator</text>

  <!-- Process 5.0 -->
  <path d="M 310,555 C 310,518 430,518 430,555 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="370" y="545" font-size="13" text-anchor="middle" fill="#000000">5.0</text>
  <rect x="310" y="555" width="120" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="370" y="576" font-size="12" text-anchor="middle" fill="#000000">Generate sales</text>
  <text x="370" y="593" font-size="12" text-anchor="middle" fill="#000000">report</text>

  <!-- Flows for 5.0 -->
  <path d="M 690,485 L 690,582 L 430,582" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="560" y="575" font-size="11" text-anchor="middle" fill="#000000">updated order details</text>

  <path d="M 310,590 L 155,590" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="232" y="583" font-size="11" text-anchor="middle" fill="#000000">sales report</text>

</svg>
