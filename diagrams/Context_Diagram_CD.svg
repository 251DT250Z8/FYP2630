<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" style="background:#ffffff; font-family:Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="40" font-size="18" font-weight="bold" fill="#000000">CD</text>

  <!-- Process 0: Pet Store System -->
  <path d="M 370,150 C 370,95 570,95 570,150 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="470" y="132" font-size="15" text-anchor="middle" fill="#000000">0</text>
  <rect x="370" y="150" width="200" height="105" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="470" y="207" font-size="15" text-anchor="middle" fill="#000000">Pet Store System</text>

  <!-- External Entity: Customer (Left) -->
  <rect x="40" y="155" width="115" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="97.5" y="195" font-size="14" text-anchor="middle" fill="#000000">Customer</text>

  <!-- External Entity: Staff (Right) -->
  <rect x="765" y="160" width="115" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="822.5" y="192" font-size="14" text-anchor="middle" fill="#000000">Staff</text>

  <!-- External Entity: Administrator (Bottom) -->
  <rect x="405" y="380" width="130" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="470" y="412" font-size="14" text-anchor="middle" fill="#000000">Administrator</text>

  <!-- Customer -> Process 0 Inflows -->
  <!-- 1. customer details -->
  <path d="M 85,155 L 85,125 L 380,125" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="225" y="118" font-size="11.5" text-anchor="middle" fill="#000000">customer details</text>

  <!-- 2. username and password -->
  <path d="M 155,165 L 370,165" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="262" y="158" font-size="11.5" text-anchor="middle" fill="#000000">username and password</text>

  <!-- 3. order info -->
  <path d="M 155,190 L 370,190" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="262" y="183" font-size="11.5" text-anchor="middle" fill="#000000">order info</text>

  <!-- Process 0 -> Customer Outflows -->
  <!-- 4. invoice -->
  <path d="M 370,215 L 155,215" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="262" y="230" font-size="11.5" text-anchor="middle" fill="#000000">invoice</text>

  <!-- 5. product catalogue -->
  <path d="M 385,255 L 385,280 L 130,280 L 130,225" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="258" y="273" font-size="11.5" text-anchor="middle" fill="#000000">product catalogue</text>

  <!-- 6. login confirmation message -->
  <path d="M 405,255 L 405,310 L 100,310 L 100,225" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="252" y="303" font-size="11.5" text-anchor="middle" fill="#000000">login confirmation message</text>

  <!-- 7. registration confirmation message -->
  <path d="M 425,255 L 425,340 L 70,340 L 70,225" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="248" y="333" font-size="11.5" text-anchor="middle" fill="#000000">registration confirmation message</text>

  <!-- Staff -> Process 0 -->
  <path d="M 765,188 L 570,188" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="668" y="181" font-size="11.5" text-anchor="middle" fill="#000000">product details</text>

  <!-- Process 0 -> Administrator -->
  <path d="M 470,255 L 470,380" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="515" y="325" font-size="11.5" text-anchor="middle" fill="#000000">sales report</text>

</svg>
