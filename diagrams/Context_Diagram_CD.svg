<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 680" width="100%" height="100%" style="background:#ffffff; font-family:Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="50" y="45" font-size="22" font-weight="bold" fill="#000000">CD</text>

  <!-- Process 0: Pet Store System (Gane & Sarson rounded top symbol) -->
  <!-- Center: x=375, y=200, width=200, height=130 -->
  <g>
    <!-- Dome cap -->
    <path d="M 375,235 C 375,190 575,190 575,235 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <!-- Process number 0 -->
    <text x="475" y="222" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">0</text>
    <!-- Process body rectangle -->
    <rect x="375" y="235" width="200" height="95" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <!-- Process name -->
    <text x="475" y="275" font-size="15" font-weight="bold" text-anchor="middle" fill="#000000">Pet Store</text>
    <text x="475" y="295" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">E-Commerce System</text>
  </g>

  <!-- External Entity: Customer (Left) -->
  <g>
    <rect x="40" y="210" width="130" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="105" y="255" font-size="15" font-weight="bold" text-anchor="middle" fill="#000000">Customer</text>
  </g>

  <!-- External Entity: Staff (Right) -->
  <g>
    <rect x="780" y="210" width="130" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="845" y="255" font-size="15" font-weight="bold" text-anchor="middle" fill="#000000">Staff</text>
  </g>

  <!-- External Entity: Administrator (Bottom) -->
  <g>
    <rect x="410" y="550" width="140" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="480" y="585" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">Administrator</text>
  </g>

  <!-- Flow Arrows: Customer <-> Process 0 -->
  <!-- Inflows: Customer -> Process 0 -->
  <!-- 1. customer details -->
  <path d="M 170,218 L 375,218" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="272" y="211" font-size="11.5" text-anchor="middle" fill="#000000">customer details</text>

  <!-- 2. username and password -->
  <path d="M 170,238 L 375,238" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="272" y="233" font-size="11.5" text-anchor="middle" fill="#000000">username and password</text>

  <!-- 3. order & payment info -->
  <path d="M 170,258 L 375,258" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="272" y="253" font-size="11.5" text-anchor="middle" fill="#000000">order &amp; payment info</text>

  <!-- 4. review & rating -->
  <path d="M 170,278 L 375,278" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="272" y="273" font-size="11.5" text-anchor="middle" fill="#000000">review &amp; rating</text>

  <!-- Outflows: Process 0 -> Customer (Loop under like in the reference) -->
  <!-- 5. product catalog & reviews -->
  <path d="M 375,298 L 170,298" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="272" y="293" font-size="11.5" text-anchor="middle" fill="#000000">product catalog &amp; reviews</text>

  <!-- 6. order invoice & receipt -->
  <path d="M 400,330 L 400,360 L 140,360 L 140,290" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="270" y="354" font-size="11.5" text-anchor="middle" fill="#000000">order invoice &amp; receipt</text>

  <!-- 7. login confirmation message -->
  <path d="M 420,330 L 420,390 L 105,390 L 105,290" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="262" y="384" font-size="11.5" text-anchor="middle" fill="#000000">login confirmation message</text>

  <!-- 8. registration confirmation message -->
  <path d="M 440,330 L 440,420 L 70,420 L 70,290" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="255" y="414" font-size="11.5" text-anchor="middle" fill="#000000">registration confirmation message</text>


  <!-- Flow Arrows: Staff <-> Process 0 -->
  <!-- Inflows from Staff to Process 0 -->
  <path d="M 780,228 L 575,228" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="677" y="222" font-size="11.5" text-anchor="middle" fill="#000000">staff credentials</text>

  <path d="M 780,248 L 575,248" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="677" y="243" font-size="11.5" text-anchor="middle" fill="#000000">product &amp; stock updates</text>

  <path d="M 780,268 L 575,268" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="677" y="263" font-size="11.5" text-anchor="middle" fill="#000000">order fulfillment status</text>

  <!-- Outflows from Process 0 to Staff -->
  <path d="M 575,288 L 780,288" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="677" y="303" font-size="11.5" text-anchor="middle" fill="#000000">customer order list &amp; alerts</text>


  <!-- Flow Arrows: Administrator <-> Process 0 -->
  <!-- Downward / Upward arrows -->
  <!-- Inflows: Admin -> Process 0 -->
  <path d="M 460,550 L 460,330" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="400" y="475" font-size="11.5" text-anchor="middle" fill="#000000" transform="rotate(-90 452 475)">admin requests &amp; credentials</text>

  <!-- Outflows: Process 0 -> Admin -->
  <path d="M 500,330 L 500,550" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="555" y="475" font-size="11.5" text-anchor="middle" fill="#000000" transform="rotate(90 508 475)">sales report &amp; audit records</text>

</svg>
